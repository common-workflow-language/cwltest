[tox]
envlist =
  py3{10,11,12,13,14,15}-lint,
  py3{10,11,12,13,14,15}-unit,
  py3{10,11,12,13,14,15}-bandit,
  py3{10,11,12,13,14,15}-mypy,
  py314-lintreadme,
  py314-pydocstyle

skip_missing_interpreters = True
isolated_build = True

[pytest]
addopts = -p pytester -n auto
pytester_example_dir = tests/test-data
testpaths = tests

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315

[testenv]
skipsdist =
  py3{10,11,12,13,14,15}-!{unit,mypy,lintreadme} = True

description =
  py3{10,11,12,13,14,15}-unit: Run the unit tests
  py3{10,11,12,13,14,15}-lint: Lint the Python code
  py3{10,11,12,13,14,15}-bandit: Search for common security issues
  py3{10,11,12,13,14,15}-mypy: Check for type safety
  py314-pydocstyle: docstring style checker
  py314-lintreadme: Lint the README.rst->.md conversion

passenv =
  CI
  GITHUB_*

deps =
  py3{10,11,12,13,14,15}-{unit,mypy}: -rrequirements.txt
  py3{10,11,12,13,14,15}-{unit,mypy}: -rtest-requirements.txt
  py3{10,11,12,13,14,15}-lint: flake8-bugbear
  py3{10,11,12,13,14,15}-lint: black~=26.1
  py3{10,11,12,13,14,15}-bandit: bandit
  py3{10,11,12,13,14,15}-mypy: -rmypy-requirements.txt

set_env =
  py3{10,11,12,13,14,15}-unit: LC_ALL = C.UTF-8
  COV_CORE_SOURCE=cwltest
  COV_CORE_CONFIG={toxinidir}/.coveragerc
  COV_CORE_DATAFILE={toxinidir}/.coverage.eager

commands =
  py3{10,11,12,13,14,15}-unit: python -m pip install -U pip setuptools wheel
  py3{10,11,12,13,14,15}-unit: python -m pytest --cov --cov-config={toxinidir}/.coveragerc --cov-append {posargs}
  py3{10,11,12,13,14,15}-unit: coverage xml
  py3{10,11,12,13,14,15}-bandit: bandit --recursive src
  py3{10,11,12,13,14,15}-lint: make flake8
  py3{10,11,12,13,14,15}-lint: make format-check
  py3{10,11,12,13,14,15}-mypy: make mypy

allowlist_externals =
  py3{10,11,12,13,14,15}-lint: flake8
  py3{10,11,12,13,14,15}-lint: black
  py3{10,11,12,13,14,15}-{mypy,shellcheck,lint,unit}: make

skip_install =
  py3{10,11,12,13,14,15}-lint: true
  py3{10,11,12,13,14,15}-bandit: true


[testenv:py314-pydocstyle]
allowlist_externals = make
commands = make diff_pydocstyle_report
deps =
    pydocstyle
    diff-cover
skip_install = true

[testenv:py314-lintreadme]
description = Lint the README.rst->.md conversion
commands =
  python -m build --outdir dist
  twine check dist/*
deps =
    twine
    build
    readme_renderer[rst]
skip_install = true
